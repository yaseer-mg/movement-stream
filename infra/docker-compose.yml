# ============================================================
# Movement Stream — Docker Compose (development)
# ============================================================
# Services:
#   postgres     — database, runs migrations from ./postgres on first init
#   api-server   — Express REST API + WebSocket (port 4000)
#   media-server — WHIP ingest + FFmpeg + HLS (ports 3001, 1935)
#   web          — builds the React app into the shared `web_build` volume
#   nginx        — edge: HLS delivery + API/WS proxy + React frontend (8081)
#
# NOTE: This dev compose is tuned for this machine. The host already runs
# nginx on :80/:443 and Postgres on :5432, so host ports are remapped here:
# web/API/WS/HLS all fronted on http://localhost:8081, DB on localhost:5437.
#
# Uses infra/nginx.dev.conf (HTTP-only). Production uses the
# HTTPS config in infra/nginx.conf via docker-compose.prod.yml.
#
# Usage, on this machine:
#   docker compose -f infra/docker-compose.yml \
#                 -f infra/docker-compose.local.yml up --build
# ============================================================

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: movement_stream
      POSTGRES_USER: movement_user
      POSTGRES_PASSWORD: Movement2025!
    ports:
      - "5437:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movement_user -d movement_stream"]
      interval: 5s
      timeout: 5s
      retries: 10

  api-server:
    build: ../apps/api-server
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    env_file: ../apps/api-server/.env
    environment:
      DB_HOST: postgres
      MEDIA_SERVER_URL: http://media-server:3001

  media-server:
    build: ../apps/media-server
    ports:
      - "3001:3001"
      - "1935:1935"
    depends_on:
      - api-server
    env_file: ../apps/media-server/.env
    environment:
      API_SERVER_URL: http://api-server:4000
    volumes:
      - hls_data:/var/hls
      - recordings_temp:/var/recordings

  web:
    build:
      context: ../apps/web
      args:
        VITE_API_URL: http://localhost
        VITE_WS_URL: ws://localhost/ws
        VITE_HLS_URL: http://localhost/hls
        VITE_MEDIA_SERVER_URL: http://localhost
    volumes:
      - web_build:/usr/share/nginx/html
    depends_on:
      - api-server

  nginx:
    image: nginx:alpine
    ports:
      - "8081:80"
    volumes:
      - ./nginx.dev.conf:/etc/nginx/nginx.conf:ro
      - web_build:/var/www/movement-stream:ro
      - hls_data:/var/hls:ro
      - recordings_temp:/var/recordings:ro
    depends_on:
      - api-server
      - media-server
      - web

volumes:
  postgres_data:
  hls_data:
  recordings_temp:
  web_build:
