# ============================================================
# FAEEZ LIVE — Nginx PRODUCTION configuration
# ============================================================
# This config runs INSIDE the Docker Compose `nginx` container
# (see infra/docker-compose.prod.yml). Upstreams resolve to the
# compose service names on the shared network.
#
# Serves:
#   - HTTP → HTTPS redirect + Let's Encrypt challenge
#   - SSL termination (Let's Encrypt certs mounted at
#     /etc/letsencrypt from the host)
#   - React frontend (built bundle from the `web_build` volume)
#   - /api  → api-server
#   - /ws   → api-server (WebSocket upgrade)
#   - /hls/ → HLS segments from the shared `hls_data` volume
#   - /recordings/ → final mp4 recordings from the shared volume
#   - /ingest/ → media-server (MediaRecorder webm ingest)
#
# After obtaining a certificate, replace your-domain.com in the
# ssl_certificate paths with the real domain.
# ============================================================

worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    # ─── Basic Settings ───
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # ─── MIME Types ───
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ─── Logging ───
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # ─── Gzip Compression ───
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/vnd.apple.mpegurl
        application/x-mpegURL
        image/svg+xml;

    # ─── Rate Limiting ───
    # Protect the API from abuse — 10 requests/second per IP
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    # ─── Upstream Servers (compose service names) ───
    upstream api_server {
        server api-server:4000;
        keepalive 32;
    }

    upstream media_server {
        server media-server:3001;
        keepalive 16;
    }

    # ─── HTTP Server — redirect everything to HTTPS ───
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Let's Encrypt HTTP-01 challenge (certbot webroot)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Everything else → HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ─── HTTPS Server (production) ───
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name _;

        # ─── SSL Certificate (Let's Encrypt) ───
        # Replace your-domain.com after running certbot
        ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

        # SSL Settings (A+ rating on SSL Labs)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # HSTS — tell browsers to always use HTTPS
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ─── HLS Video Delivery ───
        # Serves .m3u8 playlists and .ts segments from the
        # shared hls_data volume (mounted at /var/hls).
        location /hls/ {
            root /var/;

            # Live HLS must never be cached — old segments are deleted
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";

            # CORS — viewers on other domains or embedded players need this
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, OPTIONS";
            add_header Access-Control-Allow-Headers "Range";

            # Correct MIME types for HLS
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
                video/mp4 mp4;
            }

            sendfile on;
            directio 512;

            # CORS preflight
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin *;
                add_header Access-Control-Allow-Methods "GET, OPTIONS";
                add_header Access-Control-Allow-Headers "Range";
                add_header Content-Length 0;
                return 204;
            }
        }

        # ─── Media Server Proxy — ingest ───
        # Broadcaster browsers stream MediaRecorder webm here.
        location /ingest/ {
            proxy_pass http://media_server;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Stream the upload body straight through (no buffering)
            proxy_request_buffering off;
            client_max_body_size 0;

            # Broadcasters can stay connected for long streams
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ─── Recorded Files ───
        location /recordings/ {
            root /var/;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Access-Control-Allow-Origin *;
            types { video/mp4 mp4; }
        }

        # ─── API Server Proxy ───
        location /api/ {
            proxy_pass http://api_server;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            limit_req zone=api burst=20 nodelay;
        }

        # ─── WebSocket Proxy ───
        # Live chat + stream status. Must set Upgrade and Connection
        # headers so the browser switches to the WebSocket protocol.
        location /ws {
            proxy_pass http://api_server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Long-lived connections — never timeout
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ─── React Frontend ───
        # Serves the built app (web_build volume at /var/www/faeez-live).
        # try_files gives React Router its client-side fallback.
        location / {
            root /var/www/faeez-live;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # Hashed build assets — safe to cache aggressively
        location /assets/ {
            root /var/www/faeez-live;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # ─── Health Check ───
        location /health {
            proxy_pass http://api_server/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
    }
}
