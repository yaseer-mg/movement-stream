# ============================================================
# Movement Stream — Nginx Configuration
# Serves: HLS video chunks, API reverse proxy, React frontend
# ============================================================

worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    # ─── Basic Settings ───
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # ─── MIME Types ───
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ─── Logging ───
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # ─── Gzip Compression ───
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/vnd.apple.mpegurl
        application/x-mpegURL;

    # ─── Rate Limiting ───
    # Protect API from abuse — 10 requests/second per IP
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    # ─── Upstream Servers ───
    upstream api_server {
        server 127.0.0.1:4000;
        keepalive 32;
    }

    upstream media_server {
        server 127.0.0.1:3001;
        keepalive 16;
    }

    # ─── HTTP Server ───
    # Redirects all HTTP to HTTPS in production.
    # In development, serves everything on HTTP.
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Uncomment for production (after SSL is set up):
        # return 301 https://$host$request_uri;

        # ─── HLS Video Delivery ───
        # Serves .m3u8 playlists and .ts video segments
        # to viewers worldwide. This is the most critical
        # location — it delivers the live video stream.
        location /hls/ {
            root /var/;

            # CRITICAL: HLS must never be cached by browsers or CDNs
            # Old segments are deleted, so cached copies would cause errors
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";

            # CORS — viewers on different domains (or embedded players) need this
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, OPTIONS";
            add_header Access-Control-Allow-Headers "Range";

            # Correct MIME types for HLS
            # Without these, browsers won't recognize the files
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
                video/mp4 mp4;
            }

            # Efficient file serving
            sendfile on;
            directio 512;

            # Handle CORS preflight requests
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin *;
                add_header Access-Control-Allow-Methods "GET, OPTIONS";
                add_header Access-Control-Allow-Headers "Range";
                add_header Content-Length 0;
                return 204;
            }
        }

        # ─── Media Server Proxy ───
        # WebRTC WHIP endpoint — broadcaster browsers connect here
        location /whip/ {
            proxy_pass http://media_server;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # WHIP returns SDP as plain text
            proxy_set_header Accept "application/sdp";
        }

        # ─── API Server Proxy ───
        # All /api/* requests go to the Express server
        location /api/ {
            proxy_pass http://api_server;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Rate limiting
            limit_req zone=api burst=20 nodelay;
        }

        # ─── WebSocket Proxy ───
        # WebSocket connections for live chat and stream status.
        # Must set Upgrade and Connection headers so the browser
        # switches from HTTP to WebSocket protocol.
        location /ws {
            proxy_pass http://api_server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # WebSocket connections are long-lived — don't timeout
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ─── React Frontend ───
        # Serves the built React app. try_files ensures
        # React Router handles client-side routing correctly
        # (any path that doesn't match a file falls back to index.html).
        location / {
            root /var/www/movement-stream;
            index index.html;
            try_files $uri $uri/ /index.html;

            # Cache static assets (JS, CSS bundles) for 1 year
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }

        # ─── Health Check ───
        location /health {
            proxy_pass http://api_server/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
    }

    # ─── HTTPS Server (Production) ───
    # Uncomment after setting up Let's Encrypt SSL.
    # See Step 28 (VPS Deployment Guide) for SSL setup.
    #
    # server {
    #     listen 443 ssl http2;
    #     listen [::]:443 ssl http2;
    #     server_name your-domain.com;
    #
    #     # SSL Certificate (Let's Encrypt)
    #     ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    #
    #     # SSL Settings (A+ rating on SSL Labs)
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    #     ssl_prefer_server_ciphers off;
    #     ssl_session_cache shared:SSL:10m;
    #     ssl_session_timeout 10m;
    #
    #     # HSTS — tell browsers to always use HTTPS
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #
    #     # All the same location blocks as the HTTP server above
    #     # (copy them here)
    # }
}
