# ============================================================
# Movement Stream — Nginx DEVELOPMENT configuration
# ============================================================
# HTTP-only config for local development (docker-compose.yml).
# Serves everything on port 80 with no SSL or redirect.
# Upstreams resolve to compose service names.
# ============================================================

worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/vnd.apple.mpegurl
        application/x-mpegURL
        image/svg+xml;

    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    upstream api_server {
        server api-server:4000;
        keepalive 32;
    }

    upstream media_server {
        server media-server:3001;
        keepalive 16;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # ─── HLS Video Delivery ───
        location /hls/ {
            root /var/;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, OPTIONS";
            add_header Access-Control-Allow-Headers "Range";
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
                video/mp4 mp4;
            }
            sendfile on;
            directio 512;
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin *;
                add_header Access-Control-Allow-Methods "GET, OPTIONS";
                add_header Access-Control-Allow-Headers "Range";
                add_header Content-Length 0;
                return 204;
            }
        }

        # ─── Media Server Proxy — WHIP ingest ───
        location /ingest/ {
            proxy_pass http://media_server;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # MediaRecorder webm upload — stream the request body
            # straight through instead of buffering it.
            proxy_request_buffering off;
            client_max_body_size 0;

            # Broadcasters stay connected for the whole stream
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ─── Recorded Files ───
        # Serves final .mp4 recordings from the shared recordings
        # volume (mounted at /var/recordings).
        location /recordings/ {
            root /var/;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Access-Control-Allow-Origin *;
            types { video/mp4 mp4; }
        }

        # ─── API Server Proxy ───
        location /api/ {
            proxy_pass http://api_server;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            limit_req zone=api burst=20 nodelay;
        }

        # ─── WebSocket Proxy ───
        location /ws {
            proxy_pass http://api_server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ─── React Frontend ───
        location / {
            root /var/www/movement-stream;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        location /assets/ {
            root /var/www/movement-stream;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # ─── Health Check ───
        location /health {
            proxy_pass http://api_server/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
    }
}
