# ============================================================
# Movement Stream — Docker Compose (production)
# ============================================================
# Same services as docker-compose.yml but hardened for a VPS:
#   - DB not exposed to the host
#   - API/media bound to 127.0.0.1 only (edge is Nginx on 80/443)
#   - restart: unless-stopped
#   - Let's Encrypt certs mounted into nginx
#   - Frontend built with the public HTTPS URLs
#
# Requires a DOMAIN env var (e.g. stream.yourdomain.com).
# Usage:
#   DOMAIN=stream.yourdomain.com \
#   docker compose -f infra/docker-compose.prod.yml up --build -d
# ============================================================

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: movement_stream
      POSTGRES_USER: movement_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Movement2025!}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movement_user -d movement_stream"]
      interval: 5s
      timeout: 5s
      retries: 10

  api-server:
    build: ../apps/api-server
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    env_file: ../apps/api-server/.env
    environment:
      DB_HOST: postgres
      MEDIA_SERVER_URL: http://media-server:3001
      NODE_ENV: production
    restart: unless-stopped

  media-server:
    build: ../apps/media-server
    ports:
      - "127.0.0.1:3001:3001"
      - "127.0.0.1:1935:1935"
    depends_on:
      - api-server
    env_file: ../apps/media-server/.env
    environment:
      API_SERVER_URL: http://api-server:4000
      NODE_ENV: production
    volumes:
      - hls_data:/var/hls
      - recordings_temp:/var/recordings
    restart: unless-stopped

  web:
    build:
      context: ../apps/web
      args:
        VITE_API_URL: https://${DOMAIN}
        VITE_WS_URL: wss://${DOMAIN}/ws
        VITE_HLS_URL: https://${DOMAIN}/hls
        VITE_MEDIA_SERVER_URL: https://${DOMAIN}/whip
    volumes:
      - web_build:/usr/share/nginx/html
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - web_build:/var/www/movement-stream:ro
      - hls_data:/var/hls:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api-server
      - media-server
      - web
    restart: unless-stopped

volumes:
  postgres_data:
  hls_data:
  recordings_temp:
  web_build:
